name: Day-before reminder notifications
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
      timezone: Europe/London
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: yearly-budget-reminders
  cancel-in-progress: false
jobs:
  send:
    # Review branch cannot send. Owner must explicitly activate after reviewing setup.
    if: github.ref == 'refs/heads/main' && vars.YEARLY_REMINDERS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.YEARLY_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.YEARLY_GCP_SERVICE_ACCOUNT }}
          project_id: yearly-budget-c93fb
      - run: npm run send:reminders
        env:
          REMINDERS_ENABLED: 'true'
          FIREBASE_PROJECT_ID: yearly-budget-c93fb
          GITHUB_TOKEN: ${{ github.token }}
