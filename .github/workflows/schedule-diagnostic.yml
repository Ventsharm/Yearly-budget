name: Read-only scheduler diagnostic
run-name: "Scheduler diagnostic — ${{ github.event.schedule || github.event_name }}"
on:
  workflow_dispatch:
  schedule:
    # One temporary comparison slot, 14:47 UK on 15 October 2026.
    - cron: '47 13 15 10 *'
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record that GitHub created this run
        env:
          TRIGGER: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          node -e 'console.log(JSON.stringify({stage:"trigger_started",event:process.env.TRIGGER,cron:process.env.CRON,runId:process.env.GITHUB_RUN_ID,utc:new Date().toISOString()}))'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read scheduler state without Firebase access
        run: node automation/schedule-diagnostic.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIAGNOSTIC_CRON: ${{ github.event.schedule }}
